<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturheilkunde für den Hausgebrauch - Online Lesen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
        }
        .header-bar {
            height: 50px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .header-bar h1 {
            font-size: 16px;
            margin: 0;
        }
        .btn-download {
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #219653;
        }
        iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Naturheilkunde für den Hausgebrauch (Willi Vogt)</h1>
        <a class="btn-download" href="docs/NHK2026.pdf?download=1">PDF Herunterladen</a>
    </div>

    <!-- Built-in browser interactive PDF canvas framework -->
    <iframe src="docs/NHK2026.pdf"></iframe>

</body>
</html>
