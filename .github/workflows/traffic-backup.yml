name: Save Repo Traffic History

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to manually trigger it anytime

permissions:
  contents: write

jobs:
  backup-traffic:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the entire repository history cleanly
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Fetch traffic data and compile it to CSV
      - name: Fetch Repository Traffic
        uses: sangonzal/repository-traffic-action@v.0.1.6
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}

      # Step 3: Explicitly pull and merge any remote changes before committing
      - name: Sync Branch State
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase

      # Step 4: Commit and push changes safely
      - name: Commit and Push Changes
        uses: EndBug/add-and-commit@v10
        with:
          author_name: "GitHub Action"
          author_email: "actions@github.com"
          message: "Daily traffic data backup [skip ci]"
          add: "traffic/"
