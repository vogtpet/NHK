name: Repository Traffic Dashboard

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger testing inside Actions tab

concurrency:
  group: traffic-dashboard
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Fetch GitHub Repository Code Views
        run: |
          mkdir -p tools/traffic
          
          echo "=== RUNNING PYTHON REPO VIEW FETCH ==="
          python3 -c '
          import urllib.request
          import json
          import os
          
          base_api = "https://api.github.com"
          repo_path = "/repos/vogtpet/NHK"
          metrics_ep = "/traffic/views"
          full_url = base_api + repo_path + metrics_ep
          
          token = os.environ.get("GITHUB_TOKEN", "")
          
          try:
              req = urllib.request.Request(full_url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("Authorization", f"Bearer {token}")
              
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode("utf-8"))
              
              views_list = data.get("views", [])
              if views_list:
                  csv_path = "tools/traffic/views.csv"
                  existing = {}
                  
                  if os.path.exists(csv_path):
                      with open(csv_path, "r") as f:
                          for line in f.readlines()[1:]:
                              parts = line.strip().split(",")
                              if len(parts) >= 3:
                                  existing[parts[0]] = (parts[1], parts[2])
                  
                  for v in views_list:
                      day = v["timestamp"][:10]
                      existing[day] = (str(v["count"]), str(v["uniques"]))
                  
                  with open(csv_path, "w") as f:
                      f.write("Date,count,uniques\n")
                      for day in sorted(existing.keys()):
                          f.write(f"{day},{existing[day][0]},{existing[day][1]}\n")
                  print("SUCCESS: REPOSITORY TRAFFIC LOGS UPDATED CHRONOLOGICALLY")
              else:
                  raise SystemExit("No view entries returned inside the 14-day tracking frame")
          except Exception as e:
              print(f"ERROR: Repository fetch execution failed: {e}")
              raise
          '
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Fetch GoatCounter Website Stats
        run: |
          mkdir -p tools/traffic
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          site = os.environ["GOATCOUNTER_SITE"].strip()
          token = os.environ["GOATCOUNTER_TOKEN"].strip()
          end = datetime.datetime.now(datetime.timezone.utc).replace(minute=0, second=0, microsecond=0)
          start = end - datetime.timedelta(days=14)
          qs = urllib.parse.urlencode({
              "start": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "end": end.strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          req = urllib.request.Request(
              f"https://{site}.goatcounter.com/api/v0/stats/total?{qs}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")[:500]
              raise SystemExit(f"GoatCounter API {e.code} for {req.full_url}: {body}")
          rows = sorted((s["day"], int(s.get("daily", 0))) for s in data.get("stats", []))
          out = Path("tools/traffic/site_views.csv")
          out.write_text("Date,visits\n" + "".join(f"{day},{visits}\n" for day, visits in rows))
          print(f"GoatCounter: {len(rows)} days, {sum(v for _, v in rows)} visits")
          PY
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}

      - name: Update Traffic History and Summary
        run: |
          python3 tools/update_traffic_history.py
          python3 tools/summarize_traffic.py

      - name: Generate Unified Dashboard Graphic Image
        run: |
          echo "=== EXECUTING PYTHON DATA VISUALIZATION ENGINE ==="
          # Triggers the plotting code file you added to the root directory
          python3 tools/plot_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add the updated logs as well as the freshly overwitten analytical graphic image file
          git add tools/traffic/ tools/traffic_summary.csv tools/unified_dashboard_analytics.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Update logs and refresh automated dashboard graphic analytics"
          git pull --rebase origin main
          git push
