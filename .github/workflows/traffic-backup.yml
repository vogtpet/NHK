name: Traffic Backup and Website Counter

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger testing inside Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Website Visitor Counter
        run: |
          mkdir -p traffic
          TODAY=$(date +%Y-%m-%d)
          CSV_FILE="traffic/site_traffic.csv"
          
          echo "=== FETCHING DATA FROM STABLE HIT COUNTER ==="
          # Using path parameter format for visitorbadge
          SVG_DATA=$(curl -s -L --max-time 15 "https://api.visitorbadge.io/api/visitors?path=vogtpet-nhk-site")
          
          echo "DEBUG: RAW OUTPUT START"
          echo "$SVG_DATA"
          echo "DEBUG: RAW OUTPUT END"
          
          # Verify that we actually received an image/svg framework back rather than an error page
          if [[ "$SVG_DATA" != *"<svg"* ]]; then
            echo "Error: Received invalid network response from counter service. Aborting to safeguard CSV logs."
            exit 1
          fi
          
          # Extract numerical metric inside the text boundaries safely
          LIVE_COUNT=$(echo "$SVG_DATA" | tr -dc '0-9' | sed 's/^0*//')
          echo "DEBUG: EXTRACTED NUMBER IS: $LIVE_COUNT"
          
          if [ -z "$LIVE_COUNT" ]; then
            echo "Error: Extraction parsing resulted in an empty string."
            exit 1
          fi
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "Date,DailyViews,LiveTotal" > "$CSV_FILE"
          fi
          
          if grep -q "$TODAY" "$CSV_FILE"; then
            sed -i "/$TODAY/d" "$CSV_FILE"
          fi
          
          LAST_TOTAL=$(tail -n 1 "$CSV_FILE" | cut -d',' -f3)
          if [ -z "$LAST_TOTAL" ] || [ "$LAST_TOTAL" = "LiveTotal" ] || [ ${#LAST_TOTAL} -gt 15 ]; then
            # Reset baseline hook if old values are corrupted string artifacts
            LAST_TOTAL=$LIVE_COUNT
          fi
          
          DAILY_VIEWS=$((LIVE_COUNT - LAST_TOTAL))
          if [ $DAILY_VIEWS -lt 0 ]; then DAILY_VIEWS=0; fi
          
          echo "$TODAY,$DAILY_VIEWS,$LIVE_COUNT" >> "$CSV_FILE"
          echo "=== SUCCESS: CSV UPDATED ==="

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add traffic/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update repository traffic and site counter log entries"
          git push
