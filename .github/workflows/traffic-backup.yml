name: Traffic Backup and Website Counter

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger testing inside Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Website Visitor Counter
        run: |
          mkdir -p traffic
          TODAY=$(date +%Y-%m-%d)
          CSV_FILE="traffic/site_traffic.csv"
          
          echo "=== DEBUG: FETCHING DATA ==="
          SVG_DATA=$(curl -s -L --max-time 15 "https://glitch.me")
          
          echo "DEBUG: RAW SVG OUTPUT START"
          echo "$SVG_DATA"
          echo "DEBUG: RAW SVG OUTPUT END"
          
          # Clean extraction matching any sequence of digits inside the xml data elements
          LIVE_COUNT=$(echo "$SVG_DATA" | tr -dc '0-9' | sed 's/^0*//')
          echo "DEBUG: EXTRACTED NUMBER IS: $LIVE_COUNT"
          
          if [ -z "$LIVE_COUNT" ]; then
            echo "Error: Extraction parsing resulted in an empty string."
            exit 1
          fi
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "Date,DailyViews,LiveTotal" > "$CSV_FILE"
          fi
          
          if grep -q "$TODAY" "$CSV_FILE"; then
            sed -i "/$TODAY/d" "$CSV_FILE"
          fi
          
          LAST_TOTAL=$(tail -n 1 "$CSV_FILE" | cut -d',' -f3)
          if [ -z "$LAST_TOTAL" ] || [ "$LAST_TOTAL" = "LiveTotal" ]; then
            LAST_TOTAL=$LIVE_COUNT
          fi
          
          DAILY_VIEWS=$((LIVE_COUNT - LAST_TOTAL))
          if [ $DAILY_VIEWS -lt 0 ]; then DAILY_VIEWS=0; fi
          
          echo "$TODAY,$DAILY_VIEWS,$LIVE_COUNT" >> "$CSV_FILE"
          echo "=== DEBUG: SUCCESS, CSV UPDATED ==="


      # --- UPDATE AUTOMATED PUSH LAYER ---
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add traffic/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update repository traffic and site counter log entries"
          git push
