name: Save Repo Traffic History

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # This action generates the CSV files inside a local 'traffic' folder
      - name: Fetch Repository Traffic
        uses: sangonzal/repository-traffic-action@v.0.1.6
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}

      # We handle the commit and push explicitly using native git tools
      - name: Sync and Push Traffic Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force sync any remote updates made while this job ran
          git fetch origin main
          git reset --soft origin/main
          
          git add traffic/
          
          if ! git diff --cached --quiet; then
            git commit -m "Daily traffic data backup [skip ci]"
            git push origin main
          else
            echo "No new changes detected."
          fi
