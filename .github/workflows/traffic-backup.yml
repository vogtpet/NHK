name: Traffic Backup and Website Counter

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger testing inside Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Website Visitor Counter
        run: |
          mkdir -p traffic
          TODAY=$(date +%Y-%m-%d)
          CSV_FILE="traffic/site_traffic.csv"
          
          echo "=== PROCESSING ENCODED STRING ==="
          # Pure ASCII hex sequences to assemble: https://visitorbadge.io
          PART_A=$(printf "\x68\x74\x74\x70\x73\x3a\x2f\x2f\x61\x70\x6i\x2e\x76\x69\x73\x69\x74\x6f\x72\x62\x61\x64\x67\x65\x2e\x69\x6f")
          PART_B=$(printf "\x2f\x61\x70\x6i\x2f\x76\x69\x73\x69\x74\x6f\x72\x73\x3f\x70\x61\x74\x68\x3d\x76\x6f\x67\x74\x70\x65\x74\x2d\x6e\x68\x6b\x2d\x73\x69\x74\x65")
          
          FINAL_URL="${PART_A}${PART_B}"
          
          echo "=== FETCHING DATA FROM HIT COUNTER ==="
          SVG_DATA=$(curl -s -L --max-time 15 "$FINAL_URL")
          
          # Isolate the numeric count sitting inside the final text container tag element safely
          LIVE_COUNT=$(echo "$SVG_DATA" | grep -oE '<text[^>]*>[^<]*</text>' | tail -n 1 | sed -e 's/<[^>]*>//g' | tr -dc '0-9')
          echo "DEBUG: EXTRACTED NUMBER IS: $LIVE_COUNT"
          
          if [ -z "$LIVE_COUNT" ]; then
            echo "Error: Extraction parsing resulted in an empty string."
            exit 1
          fi
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "Date,DailyViews,LiveTotal" > "$CSV_FILE"
          fi
          
          if grep -q "$TODAY" "$CSV_FILE"; then
            sed -i "/$TODAY/d" "$CSV_FILE"
          fi
          
          LAST_TOTAL=$(tail -n 1 "$CSV_FILE" | cut -d',' -f3)
          if [ -z "$LAST_TOTAL" ] || [ "$LAST_TOTAL" = "LiveTotal" ] || [ ${#LAST_TOTAL} -gt 15 ]; then
            LAST_TOTAL=$LIVE_COUNT
          fi
          
          DAILY_VIEWS=$((LIVE_COUNT - LAST_TOTAL))
          if [ $DAILY_VIEWS -lt 0 ]; then DAILY_VIEWS=0; fi
          
          echo "$TODAY,$DAILY_VIEWS,$LIVE_COUNT" >> "$CSV_FILE"
          echo "=== SUCCESS: CSV UPDATED ==="

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add traffic/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update repository traffic and site counter log entries"
          git push
