name: Traffic Backup and Website Counter

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger testing inside Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Website Visitor Counter
        run: |
          mkdir -p traffic
          TODAY=$(date +%Y-%m-%d)
          CSV_FILE="traffic/site_traffic.csv"
          
          echo "=== RUNNING PYTHON SECRET TARGETED FETCH ==="
          python3 -c '
          import urllib.request
          import os
          import re
          
          full_url = os.environ.get("PROTECTED_URL", "")
          
          try:
              req = urllib.request.Request(full_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as response:
                  svg_data = response.read().decode("utf-8")
              
              matches = re.findall(r"<text[^>]*>(.*?)</text>", svg_data)
              if matches:
                  count = "".join(filter(str.isdigit, matches[-1]))
                  if count:
                      print(f"EXTRACTED_NUMBER_FOUND:{count}")
                  else:
                      print("ERROR: Clean parsing yielded no digits in text tags.")
              else:
                  print("ERROR: Response content contains no text tags.")
          except Exception as e:
              print(f"ERROR: Fetch engine routine failed: {e}")
          ' > python_output.txt

          cat python_output.txt
          
          LIVE_COUNT=$(grep "EXTRACTED_NUMBER_FOUND:" python_output.txt | cut -d':' -f2)
          rm python_output.txt
          
          echo "DEBUG: EXTRACTED NUMBER IS: $LIVE_COUNT"
          
          if [ -z "$LIVE_COUNT" ]; then
            echo "Error: Extraction parsing resulted in an empty string."
            exit 1
          fi
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "Date,DailyViews,LiveTotal" > "$CSV_FILE"
          fi
          
          if grep -q "$TODAY" "$CSV_FILE"; then
            sed -i "/$TODAY/d" "$CSV_FILE"
          fi
          
          LAST_TOTAL=$(tail -n 1 "$CSV_FILE" | cut -d',' -f3)
          if [ -z "$LAST_TOTAL" ] || [ "$LAST_TOTAL" = "LiveTotal" ] || [ ${#LAST_TOTAL} -gt 15 ]; then
            LAST_TOTAL=$LIVE_COUNT
          fi
          
          DAILY_VIEWS=$((LIVE_COUNT - LAST_TOTAL))
          if [ $DAILY_VIEWS -lt 0 ]; then DAILY_VIEWS=0; fi
          
          echo "$TODAY,$DAILY_VIEWS,$LIVE_COUNT" >> "$CSV_FILE"
          echo "=== SUCCESS: CSV UPDATED ==="
        env:
          PROTECTED_URL: ${{ secrets.COUNTER_URL }}

      - name: Fetch GitHub Repository Code Views
        run: |
          TODAY=$(date +%Y-%m-%d)
          REPO_FILE="traffic/views.csv"
          
          echo "=== FETCHING REPOSITORY VIEWS ==="
          # Querying GitHub REST API directly inside the Action environment
          curl -s -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               "https://github.com{{ github.repository }}/traffic/views" > repo_views.json
               
          # Format JSON data block cleanly to merge entries with your log tracking
          python3 -c '
          import json
          import os
          
          try:
              with open("repo_views.json", "r") as f:
                  data = json.load(f)
              
              views_list = data.get("views", [])
              if views_list:
                  # Open or initialize target CSV tracker archive
                  csv_path = "traffic/views.csv"
                  existing = {}
                  if os.path.exists(csv_path):
                      with open(csv_path, "r") as f:
                          for line in f.readlines()[1:]:
                              parts = line.strip().split(",")
                              if len(parts) >= 3:
                                  existing[parts[0][:10]] = (parts[1], parts[2])
                  
                  # Add new traffic elements over the 14-day rolling window
                  for v in views_list:
                      day = v["timestamp"][:10]
                      existing[day] = (str(v["count"]), str(v["uniques"]))
                      
                  # Save and write entries ordered chronologically
                  with open(csv_path, "w") as f:
                      f.write("Date,count,uniques\n")
                      for day in sorted(existing.keys()):
                          f.write(f"{day},{existing[day][0]},{existing[day][1]}\n")
                  print("=== REPOSITORY TRAFFIC LOG MERGED ===")
          except Exception as e:
              print(f"Error handling views output: {e}")
          '
          rm -f repo_views.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add traffic/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update repository traffic and site counter log entries"
          git push
